<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular accent line -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="12 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="480 999"/>

  <!-- Coffee & Break Stopwatch Badge -->
  <g filter="url(#shadow)" transform="translate(0, -6)">
    <!-- Cup Body -->
    <path d="M160 210 C160 300, 210 330, 256 330 C302 330, 352 300, 352 210 L160 210 Z" fill="url(#goldGrad)"/>
    <!-- Cup Handle -->
    <path d="M345 225 C385 225, 395 285, 335 295" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Cup Saucer -->
    <rect x="140" y="345" width="232" height="20" rx="10" fill="#94a3b8"/>
    
    <!-- Steam waves -->
    <path d="M210 185 C200 165, 220 145, 210 125" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M256 180 C246 155, 266 135, 256 110" fill="none" stroke="#fde047" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M302 185 C292 165, 312 145, 302 125" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    
    <!-- 30m badge pill -->
    <rect x="206" y="380" width="100" height="34" rx="17" fill="url(#glowGrad)"/>
    <text x="256" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">30 MIN</text>
  </g>
</svg>
