<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PrzerwaPro - Rejestrator Przerw PWA</title>
    <meta name="description" content="Aplikacja PWA do rejestrowania przerw w pracy z limitem 30 min, alarmem dźwiękowym, miesięcznym kalendarzem, widgetem na ekran główny oraz integracją z Google Chat." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:title" content="PrzerwaPro - Rejestrator Przerw PWA" />
    <meta property="og:description" content="Aplikacja PWA do rejestrowania przerw w pracy z limitem 30 min, alarmem dźwiękowym, miesięcznym kalendarzem, widgetem na ekran główny oraz integracją z Google Chat." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrzerwaPro" />
    
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    
    <!-- Suppress Vite HMR WebSocket connection warnings in iframe environment -->
    <script>
      window.addEventListener('error', function(event) {
        if (event && event.message && event.message.includes('WebSocket')) {
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && event.reason.message && event.reason.message.includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
