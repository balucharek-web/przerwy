<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Provide safe WebSocket shim for Vite HMR in Cloud Run iframe environment
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          function ViteSafeWebSocket(url, protocols) {
            this.url = String(url);
            this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
            this.readyState = 1; // OPEN
            this.OPEN = 1;
            this.CLOSED = 3;
            this.CLOSING = 2;
            this.CONNECTING = 0;
            this.bufferedAmount = 0;
            this.extensions = '';
            this.binaryType = 'blob';
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;
            this._listeners = {};

            setTimeout(() => {
              const ev = new Event('open');
              this.dispatchEvent(ev);
              if (typeof this.onopen === 'function') this.onopen.call(this, ev);
            }, 0);
          }

          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;

          ViteSafeWebSocket.prototype = Object.create(OriginalWebSocket.prototype);
          ViteSafeWebSocket.prototype.constructor = ViteSafeWebSocket;
          ViteSafeWebSocket.prototype.CONNECTING = 0;
          ViteSafeWebSocket.prototype.OPEN = 1;
          ViteSafeWebSocket.prototype.CLOSING = 2;
          ViteSafeWebSocket.prototype.CLOSED = 3;

          ViteSafeWebSocket.prototype.addEventListener = function(type, fn) {
            this._listeners = this._listeners || {};
            this._listeners[type] = this._listeners[type] || [];
            this._listeners[type].push(fn);
          };

          ViteSafeWebSocket.prototype.removeEventListener = function(type, fn) {
            if (!this._listeners?.[type]) return;
            this._listeners[type] = this._listeners[type].filter(f => f !== fn);
          };

          ViteSafeWebSocket.prototype.dispatchEvent = function(event) {
            const list = this._listeners?.[event.type];
            if (list) {
              list.forEach(fn => {
                try { fn.call(this, event); } catch (e) {}
              });
            }
            return true;
          };

          ViteSafeWebSocket.prototype.send = function() {};
          ViteSafeWebSocket.prototype.close = function() {
            this.readyState = 3;
            setTimeout(() => {
              const ev = new Event('close');
              this.dispatchEvent(ev);
              if (typeof this.onclose === 'function') this.onclose.call(this, ev);
            }, 0);
          };

          window.WebSocket = new Proxy(OriginalWebSocket, {
            get(target, prop, receiver) {
              if (prop === 'OPEN') return 1;
              if (prop === 'CLOSED') return 3;
              if (prop === 'CLOSING') return 2;
              if (prop === 'CONNECTING') return 0;
              return Reflect.get(target, prop, receiver);
            },
            construct(target, args) {
              const url = args[0] || '';
              const protocols = args[1];
              const isViteHmr = 
                protocols === 'vite-hmr' || 
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/') || url.includes('24678') || url.includes('vite-hmr')));

              if (isViteHmr) {
                return new ViteSafeWebSocket(url, protocols);
              }
              return new target(...args);
            }
          });
        }

        // Suppress any benign Vite HMR console error noise
        const origError = console.error;
        console.error = function(...args) {
          const str = args.map(a => {
            if (!a) return '';
            if (typeof a === 'string') return a;
            if (a.message) return a.message;
            if (a.stack) return a.stack;
            try { return JSON.stringify(a); } catch { return String(a); }
          }).join(' ');
          if (str.includes('WebSocket') || str.includes('[vite]') || str.includes('connection lost')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          if (event && (event.message?.includes('WebSocket') || event.message?.includes('vite') || event.filename?.includes('@vite/client'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (String(event.reason).includes('WebSocket') || event.reason?.message?.includes('WebSocket'))) {
            event.preventDefault();
          }
        });
      })();
    </script>
