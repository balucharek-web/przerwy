<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Provide safe WebSocket shim for Vite HMR in Cloud Run iframe environment
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          class ViteSafeWebSocket extends EventTarget {
            static CONNECTING = 0;
            static OPEN = 1;
            static CLOSING = 2;
            static CLOSED = 3;
            CONNECTING = 0;
            OPEN = 1;
            CLOSING = 2;
            CLOSED = 3;

            constructor(url, protocols) {
              super();
              this.url = String(url);
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
              this.readyState = 1; // OPEN
              this.bufferedAmount = 0;
              this.extensions = '';
              this.binaryType = 'blob';
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;

              setTimeout(() => {
                const ev = new Event('open');
                this.dispatchEvent(ev);
                if (typeof this.onopen === 'function') this.onopen(ev);
              }, 0);
            }

            send() {}
            close() {
              this.readyState = 3;
              setTimeout(() => {
                const ev = new CloseEvent('close', { wasClean: true, code: 1000 });
                this.dispatchEvent(ev);
                if (typeof this.onclose === 'function') this.onclose(ev);
              }, 0);
            }
          }

          window.WebSocket = new Proxy(OriginalWebSocket, {
            construct(target, args) {
              const url = args[0] || '';
              const protocols = args[1];
              const isViteHmr = 
                protocols === 'vite-hmr' || 
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/') || url.includes('24678')));

              if (isViteHmr) {
                return new ViteSafeWebSocket(url, protocols);
              }
              return new target(...args);
            }
          });
        }

        // Suppress any benign Vite HMR console error noise
        const origError = console.error;
        console.error = function(...args) {
          const str = args.map(a => {
            if (!a) return '';
            if (typeof a === 'string') return a;
            if (a.message) return a.message;
            if (a.stack) return a.stack;
            try { return JSON.stringify(a); } catch { return String(a); }
          }).join(' ');
          if (str.includes('WebSocket') || str.includes('[vite]') || str.includes('connection lost')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          if (event && (event.message?.includes('WebSocket') || event.message?.includes('vite') || event.filename?.includes('@vite/client'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (String(event.reason).includes('WebSocket') || event.reason?.message?.includes('WebSocket'))) {
            event.preventDefault();
          }
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <meta name="description" content="Aplikacja PWA do rejestrowania przerw w pracy z limitem 30 min, alarmem dźwiękowym, miesięcznym kalendarzem, widgetem na ekran główny oraz integracją z Google Chat." />

    <meta property="og:title" content="PrzerwaPro - Rejestrator Przerw PWA" />
    <meta property="og:description" content="Aplikacja PWA do rejestrowania przerw w pracy z limitem 30 min, alarmem dźwiękowym, miesięcznym kalendarzem, widgetem na ekran główny oraz integracją z Google Chat." />
